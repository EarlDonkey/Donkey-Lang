<!DOCTYPE html>
<html>
<head>
    <title>Donky WebSocket Test</title>
    <style>
        body { background: #1e1e1e; color: #d4d4d4; font-family: monospace; text-align: center; padding-top: 50px; }
        input, button { padding: 10px; font-size: 1.2em; margin: 5px; }
        #output { margin-top: 20px; color: #4ec9b0; font-size: 1.5em; }
    </style>
</head>
<body>
    <h1>WebSocket Echo</h1>
    <input id="msg" type="text" placeholder="Type a message...">
    <button onclick="send()">Send</button>
    <div id="output"></div>

    <script>
        const ws = new WebSocket("ws://localhost:8080/ws");
        
        ws.onopen = () => { document.getElementById("output").innerText = "Connected!"; };
        ws.onmessage = (event) => { document.getElementById("output").innerText = "Server: " + event.data; };
        
        function send() {
            const input = document.getElementById("msg");
            ws.send(input.value);
            input.value = "";
        }
    </script>
</body>
</html>
