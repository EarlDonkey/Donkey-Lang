[package]
name = "donky-native"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2.9", features = ["tls"] }
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
rfd = "0.14"
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", features = ["png"] } # <-- Explicitly add png
bincode = "1.3"
cranelift-codegen = "0.119"
cranelift-module = "0.119"
cranelift-jit = "0.119"
cranelift-frontend = "0.119"
cranelift-native = "0.119"
cranelift = "0.119"

[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Link Time Optimization
codegen-units = 1
strip = true     # Remove debug symbols